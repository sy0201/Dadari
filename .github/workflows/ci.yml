name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    # Dadari.xcodeproj는 objectVersion 77(동기화 폴더 그룹)을 쓰므로 Xcode 16 이상이 필요하다.
    runs-on: macos-15
    env:
      PROJECT: Dadari.xcodeproj
      SCHEME: Dadari

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Verify Xcode version
        run: |
          major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$major" -lt 16 ]; then
            echo "::error::Xcode 16 이상이 필요합니다 (현재 $major). project.pbxproj가 objectVersion 77입니다."
            exit 1
          fi

      # 러너 이미지가 바뀌어도 깨지지 않도록 시뮬레이터를 이름이 아니라 UDID로 찾는다.
      - name: Resolve simulator destination
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
import json, re, sys

devices = json.load(sys.stdin)["devices"]
best = None
for runtime, entries in devices.items():
    match = re.search(r"iOS-(\d+)-(\d+)", runtime)
    if not match:
        continue
    version = (int(match.group(1)), int(match.group(2)))
    for device in entries:
        if device.get("isAvailable") and device["name"].startswith("iPhone"):
            if best is None or version > best[0]:
                best = (version, device["udid"], device["name"])
if best is None:
    sys.exit("사용 가능한 iPhone 시뮬레이터가 없습니다.")
print(best[1])
')
          if [ -z "$udid" ]; then exit 1; fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      # Dadari 스킴은 앱 타겟과 위젯 익스텐션 타겟을 함께 빌드하고, appex를 앱에 임베드한다.
      - name: Build (app + widget extension)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO

      - name: Test (CyclePredictionService 등 로직 검증)
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath .build \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
